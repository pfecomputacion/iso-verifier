name: Build installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build on windows-latest
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 python-gnupg Pillow requests pyinstaller

      - name: Generate icons
        run: python generate_icon.py

      - name: Verify icons exist
        shell: bash
        run: |
          ls -la assets/
          test -f assets/icon.ico && echo "OK icon.ico"
          test -f assets/icon.png && echo "OK icon.png"

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name iso-verifier `
            --icon assets/icon.ico `
            --add-data "assets;assets" `
            iso_verifier.py

      - name: Verify binary
        shell: bash
        run: |
          ls -la dist/
          test -f dist/iso-verifier.exe && echo "OK binario Windows"

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: iso-verifier-windows
          path: dist/iso-verifier.exe

  build-linux-deb:
    name: Build on ubuntu-latest
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 python-gnupg Pillow requests pyinstaller

      - name: Generate icons
        run: python generate_icon.py

      - name: Verify icons exist
        run: |
          ls -la assets/
          test -f assets/icon_256.png && echo "OK icon_256.png"

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --name iso-verifier \
            --add-data "assets:assets" \
            iso_verifier.py

      - name: Verify binary
        run: |
          ls -la dist/
          test -f dist/iso-verifier && echo "OK binario Linux"
          file dist/iso-verifier

      - name: Build real .deb package
        run: |
          set -e
          VERSION="1.7.0"
          PKG="iso-verifier"
          ARCH="amd64"
          BUILD_DIR="deb_build"

          mkdir -p "$BUILD_DIR/DEBIAN"
          mkdir -p "$BUILD_DIR/usr/bin"
          mkdir -p "$BUILD_DIR/usr/share/applications"
          mkdir -p "$BUILD_DIR/usr/share/icons/hicolor/256x256/apps"

          install -m 755 dist/iso-verifier "$BUILD_DIR/usr/bin/$PKG"
          install -m 644 assets/icon_256.png \
            "$BUILD_DIR/usr/share/icons/hicolor/256x256/apps/$PKG.png"

          printf '%s\n' \
            '[Desktop Entry]' \
            'Name=Verificador de Firmas ISO' \
            'Comment=Comprueba firmas GPG de imagenes ISO' \
            'Exec=iso-verifier' \
            'Icon=iso-verifier' \
            'Terminal=false' \
            'Type=Application' \
            'Categories=Utility;Security;' \
            > "$BUILD_DIR/usr/share/applications/$PKG.desktop"

          SIZE=$(du -sk "$BUILD_DIR/usr" | cut -f1)
          printf '%s\n' \
            "Package: $PKG" \
            "Version: $VERSION" \
            "Section: utils" \
            "Priority: optional" \
            "Architecture: $ARCH" \
            "Depends: python3, gnupg" \
            "Maintainer: pfecomputacion" \
            "Description: Verificador de firmas ISO con GUI Qt6" \
            " Aplicacion de escritorio para verificar la autenticidad" \
            " de imagenes ISO mediante firmas GPG o hashes SHA-256." \
            "Installed-Size: $SIZE" \
            > "$BUILD_DIR/DEBIAN/control"

          dpkg-deb --build "$BUILD_DIR" "dist/${PKG}_${VERSION}_${ARCH}.deb"

          ls -la dist/*.deb
          echo "--- Contenido del paquete ---"
          dpkg-deb --info "dist/${PKG}_${VERSION}_${ARCH}.deb"
          dpkg-deb --contents "dist/${PKG}_${VERSION}_${ARCH}.deb"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: iso-verifier-deb
          path: dist/*.deb

  release:
    name: Create release
    needs: [build-windows, build-linux-deb]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
