name: Build installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: iso-verifier.exe
            asset_name: iso-verifier-${{ github.ref_name }}-windows.exe
          - os: ubuntu-latest
            artifact_name: iso-verifier_1.7.0_amd64.deb
            asset_name: iso-verifier-${{ github.ref_name }}-linux.deb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller debx

      - name: Generate icons
        run: python generate_icon.py

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name iso-verifier iso_verifier.py

      - name: Build .deb (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python - <<'PY'
          import shutil, subprocess
          from pathlib import Path
          subprocess.run(["pyinstaller", "--onefile", "--windowed",
                          "--name", "iso-verifier", "iso_verifier.py"], check=True)
          PY
          python build_installers.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
